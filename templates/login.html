{% extends "base.html" %}

{% block title %}تسجيل الدخول | لوحة التحكم{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
    <div class="glass-card">
        <h2 style="text-align: center; margin-bottom: 2rem; font-size: 1.8rem;">تسجيل الدخول 🔐</h2>
        <form action="/login" method="post">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" name="username" required placeholder="مثلاً: admin">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">دخول</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
            خاص بمدير النظام فقط
        </p>
    </div>
</div>
{% endblock %}
